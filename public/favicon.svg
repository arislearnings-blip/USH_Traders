<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="ushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#ushGrad)" filter="url(#glow)" />
  
  <!-- Subtle Internal Border -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="26.5" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  
  <!-- Geometric Trading Dynamic Arrow & Ledger Pillars -->
  <!-- Left Pillar (U) -->
  <path d="M34 40 V72 C34 81 41 88 50 88 C59 88 66 81 66 72 V58" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Pillar & Upward Growth Arrow (S / Traders Arrow) -->
  <path d="M62 48 L94 48 M94 48 L94 80 M94 48 L56 86" stroke="url(#goldGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Horizontal Balance Bar (Ledger Scale / Trading Horizon) -->
  <circle cx="34" cy="40" r="5" fill="#FFFFFF" />
  <circle cx="94" cy="48" r="5" fill="#FCD34D" />
  <circle cx="50" cy="88" r="4.5" fill="#10B981" />
  <circle cx="94" cy="80" r="4" fill="#F59E0B" />
</svg>
